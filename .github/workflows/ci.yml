name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Mirrors `uv run poe gate` exactly (house standard §3): the gate IS the CI.
  # Steps inside the gate: ruff lint -> ruff format --check -> mypy strict ->
  # xenon A -> pytest (>=90% coverage, writes coverage.xml).
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history + tags: the changelog-provenance test compares every
          # released section against that section at its own tag. Without tags
          # it skips, and a skipped provenance check is no check at all.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        # No floating v8 tag exists for setup-uv — full version pin required.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run the gate
        run: uv run poe gate

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Secret scan, via the shared brick in hseshadr/ci — where the mechanics and
  # their rationale now live. One maintained copy of this control instead of an
  # inlined duplicate that drifts: the brick also sets persist-credentials: false
  # and grants pull-requests: read, both of which this inlined copy was missing.
  #
  # Scope, stated accurately: on push and pull_request gitleaks-action passes
  # --log-opts=--no-merges --first-parent <base>^..<head>, so it reads the commits
  # that push or PR introduces — NOT the whole repository. fetch-depth: 0 only
  # makes the base commit reachable so that range resolves. A full sweep needs a
  # schedule or workflow_dispatch event, and this workflow fires on neither.
  gitleaks:
    name: Secret scan
    # The reusable workflow lists a PR's commits over the API, which needs
    # pull-requests: read. The workflow-level `contents: read` does not grant it,
    # and a caller job may raise a scope the read-only top level withholds.
    permissions:
      contents: read
      pull-requests: read
    uses: hseshadr/ci/.github/workflows/secret-scan.yml@b10a24c576f8210635f00f5e5fd7a27c614409a9 # ci-v3.2.1
