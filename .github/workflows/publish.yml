name: Publish (PyPI, OIDC)

# PyPI trusted publishing is bound to this workflow FILENAME (publish.yml).
# Renaming it silently breaks every future release.

on:
  workflow_run:
    workflows: [Dagger release candidate]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    name: Publish exact Dagger candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      # `head_branch == default_branch` above is satisfied by a dispatch on a
      # TAG named `main`, so it cannot bind the candidate to main on its own.
      # Before any artifact is touched: the triggering run must be a successful
      # dispatch of release-candidate.yml in this repository for exactly
      # HEAD_SHA, and HEAD_SHA must be reachable from the default-branch commit
      # this workflow runs on.
      - name: Verify the candidate's lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" |
            jq -e --arg sha "$HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" '
              .head_sha == $sha
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and (.path | split("@")[0]) == ".github/workflows/release-candidate.yml"
              and .repository.full_name == $repo
              and .head_repository.full_name == $repo' > /dev/null
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$HEAD_SHA...$GITHUB_SHA" --jq .status)"
          [[ "$status" == identical || "$status" == ahead ]]
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edgeproc-core-${{ github.event.workflow_run.head_sha }}
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/dist
          attestations: true
          print-hash: true
